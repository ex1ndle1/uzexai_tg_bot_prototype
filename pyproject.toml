[project]
name = "uzex"
version = "0.1.0"
description = "UZEX AI agent: Telegram + HTTP API over the exchange deals registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "aiogram>=3.13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.workspace]
members = [
    "bot_tg",
]
